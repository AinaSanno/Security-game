<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <title>インシデント・ゼロアワー | セキュリティ対応RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-phase="attack">
  <div id="app">

    <!-- ===== HUD ===== -->
    <header class="hud" id="hud">
      <div class="phases" aria-label="フェーズ">
        <span class="pill" data-p="attack">攻撃</span>
        <span class="pill" data-p="detect">特定</span>
        <span class="pill" data-p="resolve">解決</span>
      </div>
      <div class="stats">
        <div class="stat trust" title="銀行への社会的な信頼。0になるとゲームオーバー">
          <span class="lbl">信頼</span>
          <span class="bar"><i id="trustBar"></i></span>
          <span class="num" id="trustNum">100</span>
        </div>
        <div class="stat leak" id="leakStat" title="流出した口座情報の累計件数">
          <span class="lbl">流出</span>
          <span class="num" id="leakNum">0</span><span class="unit">件</span>
        </div>
        <button class="codex-btn" id="codexBtn" type="button">図鑑 <span id="codexCount">0/8</span></button>
      </div>
    </header>

    <!-- ===== 3カラム（PC）/ 縦積み（スマホ） ===== -->
    <div class="stage" id="stage">

      <!-- 左：時計 + 心電図 + 監視ログ -->
      <section class="viewport" id="viewport" aria-label="監視ログ">
        <div class="vp-top">
          <span class="place" id="place"></span>
          <span class="active-tag" id="activeTag">MONITORING</span>
        </div>

        <div class="clock-block">
          <svg class="clock-svg" viewBox="0 0 60 60" aria-hidden="true">
            <circle cx="30" cy="30" r="28" class="clock-face"/>
            <g class="clock-ticks">
              <line x1="30" y1="4" x2="30" y2="8"/>
              <line x1="56" y1="30" x2="52" y2="30"/>
              <line x1="30" y1="56" x2="30" y2="52"/>
              <line x1="4" y1="30" x2="8" y2="30"/>
            </g>
            <line id="hourHand"   x1="30" y1="30" x2="30" y2="17" class="clock-hour"/>
            <line id="minuteHand" x1="30" y1="30" x2="30" y2="11" class="clock-minute"/>
            <line id="secondHand" x1="30" y1="34" x2="30" y2="8"  class="clock-second"/>
            <circle cx="30" cy="30" r="2" class="clock-center"/>
          </svg>
          <div class="clock-text">
            <span class="clock-label">SYSTEM CLOCK</span>
            <span class="clock" id="clock">--:--</span>
            <span class="clock-sub">時間経過中...</span>
          </div>
        </div>

        <svg class="ekg" viewBox="0 0 200 30" preserveAspectRatio="none" aria-hidden="true">
          <polyline class="ekg-line" points="0,15 20,15 30,15 35,4 40,26 45,15 60,15 80,15 90,15 95,4 100,26 105,15 120,15 140,15 150,15 155,4 160,26 165,15 180,15 200,15"/>
          <line class="ekg-cursor" x1="0" y1="0" x2="0" y2="30"/>
        </svg>

        <div class="term" id="term"></div>
        <div class="stage-name" id="stageName"></div>
      </section>

      <!-- 中央：ストーリー進行 -->
      <section class="panel" id="panel"></section>

      <!-- 右：図鑑（PCのみ常時表示） -->
      <aside class="codex-panel" id="codexPanel" aria-label="IBM製品図鑑">
        <div class="cp-header">
          <span class="cp-title">IBM製品図鑑</span>
          <span class="cp-count" id="cpCount">0 / 8 発見</span>
        </div>
        <div class="cp-grid" id="cpGrid"></div>
      </aside>

    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="overlay hidden" id="overlay"></div>

  </div>
  <script src="game.js"></script>
</body>
</html>
